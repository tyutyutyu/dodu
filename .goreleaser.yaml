version: 2

project_name: dodu

git:
  ignore_tags:
    - nightly

builds:
  - id: dodu
    main: ./cmd/dodu
    binary: dodu
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: dodu
    name_template: >-
      {{ .ProjectName }}_{{ if .IsSnapshot }}nightly{{ else }}{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/install.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: '{{ if index .Env "DODU_BUILD_VERSION" }}{{ index .Env "DODU_BUILD_VERSION" }}{{ else }}{{ incpatch .Version }}-dev.{{ .ShortCommit }}{{ end }}'

changelog:
  disable: true

release:
  github:
    owner: tyutyutyu
    name: dodu
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
