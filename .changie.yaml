# yaml-language-server: $schema=https://raw.githubusercontent.com/miniscruff/changie/v1.26.0/docs/schema.json
changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## [{{.VersionNoPrefix}}](https://github.com/tyutyutyu/dodu/releases/tag/{{.Version}}) - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
footerFormat: '**Full changelog:** [{{.PreviousVersion}}...{{.Version}}](https://github.com/tyutyutyu/dodu/compare/{{.PreviousVersion}}...{{.Version}})'
kinds:
  - label: Added
    auto: minor
  - label: Changed
    auto: minor
  - label: Deprecated
    auto: minor
  - label: Removed
    auto: major
  - label: Fixed
    auto: patch
  - label: Security
    auto: patch
newlines:
  beforeChangelogVersion: 1
  beforeKind: 1
  afterKind: 1
  beforeFooterTemplate: 1
  endOfVersion: 1
replacements:
  - path: VERSION
    find: '^[0-9]+\.[0-9]+\.[0-9]+.*$'
    replace: '{{.VersionNoPrefix}}'
