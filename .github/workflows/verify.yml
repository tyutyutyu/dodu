name: verify

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run task verify
        run: |
          task verify
          task release:check
          python3 -m unittest discover -s scripts/tests -v

      - name: Isolated Alpine and vfs integration
        if: runner.os == 'Linux'
        run: sh test/integration/smoke.sh

      - name: Slackware static binary smoke
        if: runner.os == 'Linux'
        run: docker run --rm --network none -v "$PWD/bin/dodu:/usr/local/bin/dodu:ro" vbatts/slackware:15.0 dodu version

  package:
    name: Package all release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Prepare preview metadata
        run: python3 scripts/release.py prepare nightly
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --snapshot --clean --skip=publish
      - name: Verify archive checksums
        run: python3 scripts/release.py verify-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dodu-preview-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/build-info.json
          if-no-files-found: error
          retention-days: 7

  # The single required PR check; the matrix legs report as `test (<os>)`.
  verify:
    name: verify
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
