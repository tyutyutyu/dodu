name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The shared workflow skips a complete nightly for the same source commit.
  release:
    uses: ./.github/workflows/release.yml
    with:
      tag: nightly
      source_ref: ${{ github.sha }}
    secrets: inherit
